[package]
name = "cuda-nova"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
description = "CUDA sidecar engine for topology-bound official Nova proofs"
repository = "https://github.com/RyanKung/cuda-nova"

[features]
default = []
cuda = [
    "dep:cuda-core",
    "dep:cuda-device",
    "dep:cuda-host",
]
gpu-msm = ["topology-nova/gpu-msm"]
hyperkzg = ["topology-nova/hyperkzg", "nova-snark/io"]

[dependencies]
ark-bn254.workspace = true
ark-ff.workspace = true
light-poseidon.workspace = true
halo2curves.workspace = true
nova-snark.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
topology-commitment.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "faea3959950d3bb40efb6a29d03bfbc65725bae6", optional = true }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "faea3959950d3bb40efb6a29d03bfbc65725bae6", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "faea3959950d3bb40efb6a29d03bfbc65725bae6", optional = true }
topology-nova.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
topology-nova.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
halo2curves = "0.9.0"
light-poseidon = "0.4.0"
nova-snark = { version = "0.76.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.23.0"
thiserror = "2.0.17"
topology-commitment = { package = "zkfly-commitment", git = "https://github.com/RyanKung/zkfly.git", rev = "74f3a0265a2e7639bb57549a0230653275f6b1af" }
topology-nova = { package = "zkfly-nova", git = "https://github.com/RyanKung/zkfly.git", rev = "74f3a0265a2e7639bb57549a0230653275f6b1af" }

[patch.crates-io]
nova-snark = { git = "https://github.com/RyanKung/zkfly.git", rev = "74f3a0265a2e7639bb57549a0230653275f6b1af" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
